<form class="form" data-form="audit" novalidate>
  <label>Your name<input name="name" autocomplete="name" required placeholder="Your name"></label>
  <label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
  <label>Website address<input name="website" type="url" inputmode="url" required placeholder="https://yourwebsite.com"></label>
  <label>What would you like us to look at? (optional)<textarea name="message" placeholder="For example: speed, design, getting more enquiries"></textarea></label>
  <div class="hp" aria-hidden="true"><label>Leave empty<input name="company" tabindex="-1" autocomplete="off"></label></div>
  <p class="err" role="alert"></p>
  <button class="btn k" type="submit">Request my free audit</button>
  <p class="note">We use your details only to reply to you. See our <a href="/privacy"><u>Privacy</u></a> page.</p>
  <div class="ok-box" role="status">
    <h3>Request received</h3>
    <p>We'll reply within 24 hours.</p>
    <a class="btn w wa" href="#" target="_blank" rel="noopener">Continue on WhatsApp</a>
  </div>
</form>
